# Copy to ~/.agentic-workflows-lite/config.toml and edit locally.
# GitHub API credentials do not belong in this TOML file.
# See config/secrets.example.env and docs/configuration.md for private shell setup.
projects_root = "~/projects"

[linear]
# Set your personal API key here, in the local copy only.
api_key = ""

# Optional authoring convention for implementation start and from-scratch loop.
[linear.issue_structure]
mode = "warn" # required | warn | ignore; warn continues when the block is absent
block_name = "Agent instructions"

# Optional semantic readiness check by the implementation agent before edits.
# Independent of linear.issue_structure; omit this table to keep it enabled.
[implementation.task_assessment]
enabled = true

# Scope guidance shared by implementation and independent review.
[implementation.scope]
policy = "strict" # strict | balanced; strict is the default

[agent]
kind = "codex"
# Use a model ID accepted by the selected agent and account.
model = "gpt-6-astra"
# Workflow mode means Codex reasoning effort or Pi thinking level.
mode = "high"

# Independent review selection; explicit model and mode keep resume reproducible.
[reviewer]
kind = "codex"
model = "gpt-6-astra"
mode = "high"

# Optional validation guidance for initial review and same-reviewer re-review.
[review.validation]
strategy = "focused_first" # focused_first | exhaustive

# Optional Codex-only override for a repository you explicitly trust. The value
# names $CODEX_HOME/agentic-workflows-lite-trusted.config.toml; see the README.
# [codex.repositories."agentic-workflows-prototype"]
# profile = "agentic-workflows-lite-trusted"

# Optional loop wait per pass; CLI/project overrides resolve per field.
[loop]
timeout = 1800 # > 0 and <= 86400 seconds
